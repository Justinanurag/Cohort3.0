<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button onclick="buttonClickKaFunction()" id="btn">counter 0</button>
</body>
<script>
    function buttonClickKaFunction() {
        const currentValue = document.getElementById("btn").innerHTML;
        // console.log(currentValue);// counter 0 access
        const currentCounter = currentValue.split(" ")[1]; //0 access
        const newCounter = parseInt(currentCounter) + 1;
        // console.log(currentValue)
        document.getElementById("btn").innerHTML = "counter " + newCounter;
    }
</script>
</html>
