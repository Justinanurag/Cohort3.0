<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 id="Id">ID:</h1>
    <h1 id="body">Body:</h1>
    <h1 id="title">Title:</h1>
    <h1 id="userId">User ID:</h1>
    <script>
        async function fetchData() {
            const response = await fetch('https://jsonplaceholder.typicode.com/posts');
            const data = await response.json();
            console.log(data);
            document.getElementById("Id").innerHTML = "ID: " + data[0].id;
            document.getElementById("body").innerHTML = "Body: " + data[0].body;
            document.getElementById("title").innerHTML = "Title: " + data[0].title;
            document.getElementById("userId").innerHTML = "User ID: " + data[0].userId;
        }
        fetchData();
    </script>
</body>

</html>
